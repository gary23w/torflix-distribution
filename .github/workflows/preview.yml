name: Verify published release manifests
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release to render and validate without publishing
        required: true
        default: v0.3.0
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { channel: homebrew, os: ubuntu-24.04 }
          - { channel: scoop, os: windows-2025 }
          - { channel: winget, os: windows-2025 }
          - { channel: pacstall, os: ubuntu-24.04 }
          - { channel: chocolatey, os: windows-2025 }
          - { channel: aur, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm test
      - name: Render existing release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_CHANNEL: ${{ matrix.channel }}
          UPDATE_TAG: ${{ inputs.tag }}
        shell: bash
        run: node update.mjs preview --channel="$UPDATE_CHANNEL" --tag="$UPDATE_TAG"
      - name: Validate winget manifests
        if: matrix.channel == 'winget'
        shell: pwsh
        env:
          UPDATE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:UPDATE_TAG.Substring(1)
          winget validate --manifest "artifacts/winget/manifests/g/GarrettStimpson/Torflix/$version"
          if ($LASTEXITCODE) { throw 'winget validation failed' }
      - name: Pack Chocolatey package without uploading
        if: matrix.channel == 'chocolatey'
        shell: pwsh
        run: |
          choco pack artifacts/chocolatey/torflix.nuspec --outputdirectory artifacts/chocolatey
          if ($LASTEXITCODE) { throw 'Chocolatey packaging failed' }
      - name: Check Pacstall syntax
        if: matrix.channel == 'pacstall'
        run: bash -n artifacts/pacstall/packages/torflix-deb/torflix-deb.pacscript
      - name: Check AUR syntax
        if: matrix.channel == 'aur'
        run: bash -n artifacts/aur/PKGBUILD
      - name: Check Ruby syntax
        if: matrix.channel == 'homebrew'
        run: ruby -c artifacts/homebrew/Casks/torflix.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-${{ matrix.channel }}
          path: artifacts/
